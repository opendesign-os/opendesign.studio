name: opendesign

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opendesign
      POSTGRES_PASSWORD: opendesign
      POSTGRES_DB: opendesign
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendesign"]
      interval: 5s
      retries: 10

  storage:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opendesign
      MINIO_ROOT_PASSWORD: opendesign
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage:/data

volumes:
  postgres:
  storage:
