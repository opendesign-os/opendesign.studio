[package]
name = "opendesign"
version = "0.1.0"
description = "opendesign.studio 桌面端与移动端外壳"
edition = "2024"
rust-version = "1.85"

[lib]
name = "opendesign_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
